openapi: 3.1.0
info:
  title: clearance-central
  version: 0.2.0
  description: |
    central server for [clearance](https://github.com/syrenaaa/clearance), a plugin for scp: secret
    laboratory servers. collects anonymous daily stats + shared ban reports.

    - times are unix secs (ints)
    - user ids are trimmed + lowercased, e.g. `76561198000000000@steam`
    - bodies must be `application/json` (else 415), max 16 KiB (else 413)
    - any route may 500 with an `Error` body. the plugin retries writes on 5xx, fails open on lookups
    - only claims are rate limited (429)

    `/` is the index page, `/stats` the network stats, `/docs` this reference, `/openapi.yaml` the
    raw spec.
servers:
  - url: https://sl-clearance.val.run
security:
  - serverKey: []

tags:
  - name: servers
    description: claim a listing, get an api key
  - name: stats
    description: anonymous daily aggregates
  - name: reports
    description: shared ban reports

paths:
  /v1/servers:
    post:
      tags: [servers]
      summary: register a server (admin)
      description: |
        for the operator's own servers, until claim verification works.
        an address that already has a live server gets a new key (same serverId); the old key dies.
        the api key is shown once.
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimRequest" }
      responses:
        "201":
          description: registered or re-keyed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/servers/claims:
    post:
      tags: [servers]
      summary: start a claim
      description: |
        returns a claim token. put it in the server info of ur verified server, then call verify.
        claims expire after an hour; max 5 pending per address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimRequest" }
      responses:
        "201":
          description: claim created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/servers/claims/{claimId}/verify:
    post:
      tags: [servers]
      summary: finish a claim, get the api key
      description: |
        looks for the claim token in the server's server info on the verified list.
        on success the api key is shown once; only its hash is stored. claims are single use.
        if the address already has a live server it gets the new key (same serverId), so
        verifying again recovers a lost key.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerKey" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            not on the list (`server_not_listed`) or token not in the server info
            (`token_not_found`), yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: verified server list unreadable rn, retry later
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/servers/{serverId}:
    delete:
      tags: [servers]
      summary: revoke a server (admin)
      description: kills the server's key and hides all its stats + reports
      security:
        - adminKey: []
      parameters:
        - $ref: "#/components/parameters/ServerId"
      responses:
        "204":
          description: revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/stats/{day}:
    put:
      tags: [stats]
      summary: upload one day of aggregates
      description: |
        idempotent: re-uploading a day replaces it.
        days with < 20 checks total are accepted but not stored, so small servers can't be
        re-identified.
      parameters:
        - name: day
          in: path
          required: true
          description: utc day, `YYYY-MM-DD`, not in the future, not older than the retention window (2 years)
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyStats" }
      responses:
        "200":
          description: accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/stats/network:
    get:
      tags: [stats]
      summary: network-wide aggregates
      description: |
        sums over all live servers in the range (inclusive, max 366 days) + ban rate per score
        bucket. for picking default thresholds and comparing one server to the network.

        only days where at least 5 live servers stored stats are summed. otherwise a server could
        subtract its own upload from a small day and read off another server's numbers. days
        below that are left out, not partially counted.

        public, no key needed: it's counts only, and it backs the `/stats` page.
      security: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: aggregates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkStats" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/reports:
    post:
      tags: [reports]
      summary: report a ban or a pardon
      description: |
        sent from the plugin's background queue. idempotent per (server, kind, clientRef):
        sending the same one twice returns the existing report.
        bans must be inside the retention window (2 years).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "200":
          description: already reported (same clientRef)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: the pardon points at a ban this server didn't report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/players/{userId}:
    get:
      tags: [reports]
      summary: network facts about a player
      description: |
        called in pre-auth while the player waits, so it's fast.
        counts only bans that are still running (not expired, not pardoned) from live servers
        inside the retention window.
        no reports = zeros, not 404.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: facts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerFacts" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    serverKey:
      type: http
      scheme: bearer
      description: per-server api key from register / verify
    adminKey:
      type: http
      scheme: bearer
      description: admin key from the service's env (`CENTRAL_ADMIN_KEY`)

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UserId" }
    ServerId:
      name: serverId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ServerId" }
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: missing, wrong or revoked key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: too many requests. wait `Retry-After` secs, then retry
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    UserId:
      type: string
      description: lowercase user id + auth provider suffix
      pattern: '^[^@\s]+@(steam|discord|northwood)$'
      examples: ["76561198000000000@steam"]

    ServerId:
      type: string
      description: opaque. new ones are ulids
      examples: ["01K83Z0R8X6S9J7W2C4QV5M1TB"]

    UnixTime:
      type: integer
      format: int64
      minimum: 0

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: machine-readable code, e.g. `invalid_day`
        message:
          type: string

    ClaimRequest:
      type: object
      required: [address, port]
      properties:
        address:
          type: string
          description: public address, as on the server list
        port: { type: integer, minimum: 1, maximum: 65535 }

    Claim:
      type: object
      required: [claimId, token, expiresAt]
      properties:
        claimId:
          type: string
          description: secret, only u get it. needed for verify
        token:
          type: string
          description: put this in the server info, then call verify
        expiresAt: { $ref: "#/components/schemas/UnixTime" }

    ServerKey:
      type: object
      required: [serverId, apiKey]
      properties:
        serverId: { $ref: "#/components/schemas/ServerId" }
        apiKey:
          type: string
          description: shown once. goes in the plugin config as `CentralKey`

    ScoreBuckets:
      type: object
      description: |
        counts per score bucket. keys are the bucket's lower bound in steps of 10
        (`"0"`, `"10"`, ..., `"130"`). `"130"` is open ended: it holds every score >= 130, so the
        plugin clamps before bucketing. missing = 0
      propertyNames:
        pattern: "^(0|[1-9]0|1[0-3]0)$"
      additionalProperties: { type: integer, minimum: 0 }

    CheckCounts:
      type: object
      description: how each check that day ended
      additionalProperties: false
      properties:
        allow: { type: integer, minimum: 0 }
        flag: { type: integer, minimum: 0 }
        deny: { type: integer, minimum: 0 }
        bypass: { type: integer, minimum: 0 }
        allowlisted: { type: integer, minimum: 0 }
        sponsored: { type: integer, minimum: 0 }
        steamError: { type: integer, minimum: 0 }
        steamDownNew: { type: integer, minimum: 0 }

    DailyStats:
      type: object
      required: [pluginVersion, enforce, thresholds, checks, scores, bansByJoinScore]
      additionalProperties: false
      properties:
        pluginVersion:
          type: string
          examples: ["1.0.0"]
        enforce:
          type: boolean
          description: rejecting players, or only logging
        thresholds:
          type: object
          required: [allowScore, flagScore]
          additionalProperties: false
          properties:
            allowScore: { type: integer }
            flagScore: { type: integer }
        checks: { $ref: "#/components/schemas/CheckCounts" }
        scores:
          $ref: "#/components/schemas/ScoreBuckets"
          description: scores of scored checks (allow / flag / deny) that day
        bansByJoinScore:
          $ref: "#/components/schemas/ScoreBuckets"
          description: |
            bans issued that day, bucketed by the banned player's score at their last check.
            the plugin looks the score up locally; no user ids are sent

    StatsAccepted:
      type: object
      required: [stored]
      properties:
        stored: { type: boolean }
        reason:
          type: string
          enum: [too_few_checks]
          description: only when stored is false

    NetworkStats:
      type: object
      required: [from, to, servers, days, checks, scores, bansByJoinScore, banRateByScore]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        servers:
          type: integer
          description: servers with at least one stored day among the summed days
        days:
          type: integer
          description: days in range that had enough servers to be summed
        checks: { $ref: "#/components/schemas/CheckCounts" }
        scores: { $ref: "#/components/schemas/ScoreBuckets" }
        bansByJoinScore: { $ref: "#/components/schemas/ScoreBuckets" }
        banRateByScore:
          type: object
          description: bansByJoinScore / scores per bucket. buckets with no scored checks are left out
          propertyNames:
            pattern: "^(0|[1-9]0|1[0-3]0)$"
          additionalProperties: { type: number, minimum: 0 }

    BanCategory:
      type: string
      enum: [cheating, griefing, harassment, ban_evasion, other]

    ReportRequest:
      oneOf:
        - $ref: "#/components/schemas/BanReport"
        - $ref: "#/components/schemas/PardonReport"
      discriminator:
        propertyName: kind
        mapping:
          ban: "#/components/schemas/BanReport"
          pardon: "#/components/schemas/PardonReport"

    BanReport:
      type: object
      required: [kind, clientRef, userId, at, duration, severity, category]
      additionalProperties: false
      properties:
        kind: { const: ban }
        clientRef:
          type: string
          description: |
            unique per server, forever. the plugin uses `<install id>:<punishment id>` so a reset
            local db can't reuse an old ref (that would silently return the old report)
        userId: { $ref: "#/components/schemas/UserId" }
        at: { $ref: "#/components/schemas/UnixTime" }
        duration:
          description: ban length in secs, `null` = permanent. expired bans stop counting
          oneOf:
            - type: "null"
            - { type: integer, minimum: 1, maximum: 3155760000 }
        severity: { type: integer, minimum: 1, maximum: 5 }
        category: { $ref: "#/components/schemas/BanCategory" }

    PardonReport:
      type: object
      required: [kind, clientRef, reportId, at]
      additionalProperties: false
      properties:
        kind: { const: pardon }
        clientRef:
          type: string
          description: may equal the ban's clientRef; uniqueness is per kind
        reportId:
          type: string
          description: a ban this same server reported earlier
        at: { $ref: "#/components/schemas/UnixTime" }

    Report:
      type: object
      required: [reportId, kind, receivedAt]
      properties:
        reportId: { type: string }
        kind: { type: string, enum: [ban, pardon] }
        receivedAt: { $ref: "#/components/schemas/UnixTime" }

    PlayerFacts:
      type: object
      required: [userId, distinctServers, activeBans, lastBan]
      description: |
        running bans only. deliberately no "first seen" or sighting data: tracking joins across
        servers isn't server security
      properties:
        userId: { $ref: "#/components/schemas/UserId" }
        distinctServers:
          type: integer
          minimum: 0
          description: live servers with a running ban for this player
        activeBans:
          type: integer
          minimum: 0
          description: running bans, i.e. not expired and not pardoned
        lastBan:
          oneOf:
            - type: "null"
            - type: object
              required: [at, expiresAt, severity, category]
              properties:
                at: { $ref: "#/components/schemas/UnixTime" }
                expiresAt:
                  description: "`null` = permanent"
                  oneOf:
                    - type: "null"
                    - { $ref: "#/components/schemas/UnixTime" }
                severity: { type: integer }
                category: { $ref: "#/components/schemas/BanCategory" }
